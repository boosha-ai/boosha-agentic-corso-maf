[project]
name = "boosha-agentic-corso-maf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agent-framework-core>=1.20.0",
    "agent-framework-devui>=1.0.0b261002",
    "agent-framework-ollama>=1.0.0b261002",
    "agent-framework-openai>=1.15.0",
    "agent-framework-orchestrations>=1.3.0",
    "beautifulsoup4>=4.15.0",
    "gradio>=6.20.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.26",
]

# Da EP 4 il Debate Club e' anche un progetto, nella cartella progetto/ della puntata.
# Queste righe creano il comando `uv run debate-club`, che usa il progetto dell'ultima
# puntata uscita. I notebook invece importano sempre la copia della loro puntata.
[project.scripts]
debate-club = "debate_club.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maf/ep04_orchestrazione/progetto/debate_club"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# I test del Debate Club: girano senza rete e senza modello (`uv run pytest`).
testpaths = ["maf/ep04_orchestrazione/progetto/tests"]
